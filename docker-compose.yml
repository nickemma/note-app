version: '3.8'
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./java-backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"

  mongo:
    image: mongo:5.0
    ports:
      - "27017:27017"

  java-backend:
    build: ./java-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notesdb
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

  go-backend:
    build: ./go-backend
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}

  python-backend:
    build: ./python-backend
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - java-backend
      - go-backend
      - python-backend
    environment:
      - NEXT_PUBLIC_JAVA_API_URL=${JAVA_API_URL}
      - NEXT_PUBLIC_GO_API_URL=${GO_API_URL}
      - NEXT_PUBLIC_PYTHON_API_URL=${PYTHON_API_URL}